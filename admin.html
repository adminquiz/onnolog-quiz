<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnnoLog ADM - Premium</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --p: #6366f1; 
            --s: #10b981; 
            --e: #f43f5e; 
            --dark: #0f172a; 
        }

        body { 
            font-family: 'Inter', sans-serif; 
            /* Fundo Animado com Gradiente */
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #312e81, #1e293b);
            background-size: 400% 400%;
            animation: gradientBg 15s ease infinite;
            color: #f8fafc; 
            min-height: 100vh;
            padding: 40px 20px; 
            margin: 0; 
            display: flex;
            justify-content: center;
        }

        @keyframes gradientBg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .dashboard { 
            max-width: 1100px; 
            width: 100%;
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 20px; 
        }

        /* Glassmorphism Card */
        .card { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            padding: 24px; 
            border-radius: 24px; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .card:hover { transform: translateY(-5px); border-color: rgba(255, 255, 255, 0.2); }

        .card.success { border-top: 4px solid var(--s); }
        .card.error { border-top: 4px solid var(--e); }

        .full { grid-column: span 4; }
        .half { grid-column: span 2; }

        @media (max-width: 768px) {
            .half, .card { grid-column: span 4; }
        }

        .label { font-size: 12px; color: #94a3b8; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .value { font-size: 36px; font-weight: 800; display: block; margin-top: 8px; color: #fff; }

        /* Tabela Estilizada */
        table { width: 100%; border-collapse: separate; border-spacing: 0 10px; margin-top: 15px; }
        th { text-align: left; padding: 12px 16px; font-size: 13px; color: #94a3b8; }
        td { padding: 16px; background: rgba(255, 255, 255, 0.03); font-size: 14px; border: none; color: #e2e8f0; }
        td:first-child { border-radius: 12px 0 0 12px; }
        td:last-child { border-radius: 0 12px 12px 0; }
        tr:hover td { background: rgba(255, 255, 255, 0.07); }

        .btn { 
            background: linear-gradient(135deg, var(--p), #4f46e5); 
            color: white; border: none; padding: 14px; border-radius: 12px; 
            cursor: pointer; font-weight: 700; width: 100%; margin-top: 15px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            transition: all 0.3s;
        }
        .btn:hover { filter: brightness(1.2); transform: scale(1.01); }

        input { 
            width: 100%; padding: 12px; margin: 10px 0; 
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 10px; box-sizing: border-box; 
            background: rgba(0,0,0,0.3); color: white;
            outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--p); background: rgba(0,0,0,0.4); }

        .q-item { 
            padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .del-q { color: var(--e); cursor: pointer; border: none; background: none; font-size: 11px; font-weight: bold; opacity: 0.6; }
        .del-q:hover { opacity: 1; }
        
        #q-list::-webkit-scrollbar { width: 6px; }
        #q-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="card"><span class="label">Participantes</span><span class="value" id="st-total">0</span></div>
    <div class="card"><span class="label">Média Global</span><span class="value" id="st-avg">0</span></div>
    <div class="card success"><span class="label">% Acerto Real</span><span class="value" id="st-hit" style="color:var(--s)">0%</span></div>
    <div class="card error"><span class="label">% Erro Real</span><span class="value" id="st-miss" style="color:var(--e)">0%</span></div>

    <div class="card half">
        <h3 style="margin:0 0 15px 0; font-weight: 800;">Nova Pergunta</h3>
        <input type="text" id="new-q" placeholder="Texto da Pergunta">
        <input type="text" id="new-o1" placeholder="Opção CORRETA" style="border-left: 4px solid var(--s)">
        <input type="text" id="new-o2" placeholder="Opção Errada 1" style="border-left: 4px solid var(--e)">
        <input type="text" id="new-o3" placeholder="Opção Errada 2" style="border-left: 4px solid var(--e)">
        <input type="text" id="new-o4" placeholder="Opção Errada 3" style="border-left: 4px solid var(--e)">
        <button class="btn" onclick="addQuestion()">ADICIONAR PERGUNTA</button>
    </div>

    <div class="card half">
        <h3 style="margin:0 0 15px 0; font-weight: 800;">Perguntas Ativas</h3>
        <div id="q-list" style="max-height: 280px; overflow-y: auto; font-size: 13px;">Carregando...</div>
    </div>

    <div class="card full">
        <h3 style="margin:0 0 10px 0; font-weight: 800;">Desempenho (Rondonópolis)</h3>
        <table id="rank-table">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Pontos</th>
                    <th>Acertos</th>
                    <th>Horário</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <button onclick="clearRanking()" style="background:none; border:none; color:var(--e); cursor:pointer; margin-top:20px; font-size:12px; font-weight: 600; letter-spacing: 0.5px;">ZERAR TODOS OS RESULTADOS</button>
    </div>
</div>

<script>
    const _supabase = supabase.createClient('https://zdthxlhknxpbdfzcozls.supabase.co', 'sb_publishable_6gT5fcstwt1QLjCf5PCAPA_2Ec_6mU4');

    async function load() {
        const { data: qs } = await _supabase.from('perguntas').select('*');
        const { data: rs } = await _supabase.from('ranking').select('*').order('pontos', { ascending: false });
        
        if(qs) {
            document.getElementById('q-list').innerHTML = qs.map(q => `
                <div class="q-item">
                    <span>${q.pergunta}</span>
                    <button class="del-q" onclick="deleteQuestion(${q.id})">EXCLUIR</button>
                </div>
            `).join('');
        }
        if(rs) renderStats(rs, qs ? qs.length : 0);
    }

    function renderStats(data, totalQ) {
        const total = data.length;
        document.getElementById('st-total').innerText = total;
        const avg = total > 0 ? Math.round(data.reduce((a, b) => a + b.pontos, 0) / total) : 0;
        document.getElementById('st-avg').innerText = avg;

        const hits = data.reduce((a, b) => a + (b.acertos_reais || 0), 0);
        const totalPossible = total * totalQ;
        const perc = totalPossible > 0 ? Math.round((hits / totalPossible) * 100) : 0;

        document.getElementById('st-hit').innerText = perc + "%";
        document.getElementById('st-miss').innerText = (total > 0 ? 100 - perc : 0) + "%";

        document.querySelector('#rank-table tbody').innerHTML = data.map(s => {
            const time = s.criado_em ? new Date(s.criado_em).toLocaleString("pt-BR", {timeZone: "America/Cuiaba"}) : "---";
            return `<tr><td><b style="color:#fff">${s.nome}</b></td><td>${s.pontos} pts</td><td>${s.acertos_reais || 0}/${totalQ}</td><td>${time}</td></tr>`;
        }).join('');
    }

    async function addQuestion() {
        const q = document.getElementById('new-q').value;
        const o1 = document.getElementById('new-o1').value;
        const o2 = document.getElementById('new-o2').value;
        const o3 = document.getElementById('new-o3').value;
        const o4 = document.getElementById('new-o4').value;

        if(!q || !o1 || !o2 || !o3 || !o4) return alert("Por favor, preencha a pergunta e todas as 4 opções!");

        const { error } = await _supabase.from('perguntas').insert([{ 
            pergunta: q, 
            opcoes: [o1, o2, o3, o4], 
            correta: 0 
        }]);

        if(error) alert("Erro ao salvar: " + error.message);
        else {
            document.querySelectorAll('input').forEach(i => i.value = ''); // Limpa inputs
            load();
        }
    }

    async function deleteQuestion(id) {
        if(confirm("Deseja realmente excluir esta pergunta?")) {
            await _supabase.from('perguntas').delete().eq('id', id);
            load();
        }
    }

    async function clearRanking() { if(confirm("Zerar ranking?")) { await _supabase.from('ranking').delete().neq('id', 0); load(); } }
    
    load();
</script>
</body>
</html>
