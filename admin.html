<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnnoLog Pro | Enterprise Management</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Variáveis de Cor - Modo Escuro (Padrão) */
        :root { 
            --primary: #2e8b7f; /* Baseado no verde da logo */
            --primary-light: #4caf9d; /* Versão mais clara do primary */
            --success: #66bb6a; /* Verde mais vibrante para sucesso */
            --error: #ef5350; /* Vermelho padrão para erro */
            
            --bg: #1a202c; /* Fundo escuro */
            --card-bg: rgba(255, 255, 255, 0.08); /* Fundo dos cards com transparência */
            --text-main: #e2e8f0; /* Cor principal do texto */
            --text-muted: #a0aec0; /* Cor de texto secundário */
            --border: rgba(255, 255, 255, 0.15); /* Cor da borda */
            
            --gold: #ffc107; /* Ouro */
            --silver: #bdbdbd; /* Prata */
            --bronze: #d2691e; /* Bronze */

            --input-bg: rgba(0, 0, 0, 0.25); /* Fundo dos inputs */
            --btn-bg: #e2e8f0; /* Fundo dos botões claros */
            --btn-text: #1a202c; /* Cor do texto dos botões claros */
            --nav-bg: rgba(255, 255, 255, 0.05); /* Fundo da navegação */
        }

        /* Variáveis de Cor - Modo Claro */
        [data-theme="light"] {
            --primary: #2e8b7f; /* Mantém o primary para consistência da marca */
            --primary-light: #4caf9d;
            --success: #4caf50;
            --error: #ef5350;

            --bg: #f8fafc; /* Fundo claro */
            --card-bg: rgba(255, 255, 255, 0.9); /* Fundo dos cards claros */
            --text-main: #2d3748;
            --text-muted: #718096;
            --border: rgba(0, 0, 0, 0.1);

            --input-bg: #ffffff;
            --btn-bg: #2d3748;
            --btn-text: #ffffff;
            --nav-bg: #e2e8f0;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg);
            /* Gradiente animado com base na cor da logo */
            background-image: radial-gradient(circle at top right, var(--primary), var(--bg) 60%);
            background-attachment: fixed; 
            color: var(--text-main); 
            min-height: 100vh; margin: 0; 
            display: flex; flex-direction: column; align-items: center; padding-bottom: 50px;
            transition: background 0.5s ease-in-out, color 0.5s ease-in-out;
        }

        /* Toggle Theme Button */
        .theme-switch {
            position: fixed; top: 20px; right: 20px;
            background: var(--card-bg); border: 1px solid var(--border);
            padding: 8px 15px; border-radius: 20px; cursor: pointer;
            font-size: 12px; font-weight: 700; color: var(--text-main);
            backdrop-filter: blur(10px); z-index: 1000;
            display: flex; align-items: center; gap: 8px;
            transition: background 0.3s, color 0.3s, border-color 0.3s;
        }

        /* Header com Logo */
        .header { 
            width: 100%; max-width: 1100px; padding: 40px 20px; 
            display: flex; justify-content: space-between; align-items: center; 
            box-sizing: border-box; 
        }
        .header .logo-section { display: flex; align-items: center; gap: 15px; }
        .header .logo-svg { 
            width: 40px; height: 40px; 
            fill: var(--primary-light); /* Cor da logo ajustada */
            transition: fill 0.3s;
        }
        .header h1 { 
            margin: 0; font-size: 24px; letter-spacing: -0.5px; 
            color: var(--text-main); transition: color 0.3s;
        }
        .header h1 span { font-weight: 300; color: var(--primary-light); transition: color 0.3s; }
        .header p { margin: 0; color: var(--text-muted); font-size: 12px; transition: color 0.3s; }

        /* Navegação */
        .nav-tabs { display: flex; gap: 10px; background: var(--nav-bg); padding: 5px; border-radius: 12px; transition: background 0.3s; }
        .nav-btn { 
            padding: 10px 20px; border: none; background: none; 
            color: var(--text-muted); cursor: pointer; font-weight: 600; 
            border-radius: 8px; transition: 0.3s; 
        }
        .nav-btn.active { 
            background: var(--card-bg); color: var(--text-main); 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }

        .container { width: 100%; max-width: 1100px; padding: 0 20px; box-sizing: border-box; }
        .panel { display: none; animation: fadeIn 0.4s ease-out; }
        .panel.active { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Cards */
        .card { 
            background: var(--card-bg); backdrop-filter: blur(20px); 
            padding: 24px; border-radius: 20px; border: 1px solid var(--border); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
        }
        .full { grid-column: span 4; } .half { grid-column: span 2; }
        .label { font-size: 11px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; transition: color 0.3s; }
        .value { font-size: 32px; font-weight: 800; display: block; margin-top: 5px; color: var(--text-main); transition: color 0.3s; }
        
        /* Pódio */
        .podium-container { display: flex; justify-content: center; align-items: flex-end; height: 250px; margin: 40px 0 20px; gap: 10px; }
        .podium-step { display: flex; flex-direction: column; align-items: center; width: 120px; }
        .step-block { width: 100%; border-radius: 12px 12px 0 0; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 24px; }
        .first .step-block { height: 120px; background: linear-gradient(to top, #c79a00, var(--gold)); color: #fff; }
        .second .step-block { height: 80px; background: linear-gradient(to top, #758699, var(--silver)); color: #fff; }
        .third .step-block { height: 60px; background: linear-gradient(to top, #a15d0b, var(--bronze)); color: #fff; }
        .avatar { font-size: 40px; margin-bottom: 10px; animation: celebrate 1s ease-in-out infinite alternate; }
        @keyframes celebrate { from { transform: translateY(0); } to { transform: translateY(-15px); } }
        .podium-name { color: var(--text-main); font-weight: 700; margin-bottom: 5px; font-size: 14px; transition: color 0.3s; }
        .first .podium-name { color: var(--gold); font-weight: 800; font-size: 16px; }

        /* Tabela & Form */
        table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
        td { padding: 16px; background: var(--input-bg); border: none; color: var(--text-main); border-radius: 12px; transition: background 0.3s, color 0.3s; }
        td:first-child { font-weight: 600; }
        td:last-child { color: var(--text-muted); font-size: 12px; }
        th { text-align: left; padding: 12px 16px; font-size: 12px; color: var(--text-muted); text-transform: uppercase; }

        input { 
            width: 100%; padding: 10px; margin: 8px 0; border: 1px solid var(--border); 
            border-radius: 12px; background: var(--input-bg); color: var(--text-main); 
            outline: none; transition: background 0.3s, border-color 0.3s, color 0.3s;
        }
        input:focus { border-color: var(--primary); }
        input::placeholder { color: var(--text-muted); }

        .btn-main { 
            background: var(--btn-bg); color: var(--btn-text); border: none; padding: 16px; 
            border-radius: 12px; cursor: pointer; font-weight: 700; width: 100%; margin-top: 10px; 
            transition: background 0.3s, color 0.3s, transform 0.3s; 
        }
        .btn-main:hover { transform: translateY(-2px); opacity: 0.9; }
        .q-item { padding: 12px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .q-item span { color: var(--text-main); transition: color 0.3s; }
        .del-q { color: var(--error); cursor: pointer; border: none; background: none; font-size: 10px; font-weight: bold; }

        @media (max-width: 768px) { .panel.active { grid-template-columns: 1fr; } .half, .full { grid-column: span 1; } .header { flex-direction: column; gap: 20px; text-align: center; } }
    </style>
</head>
<body data-theme="dark">

<button class="theme-switch" onclick="toggleTheme()">
    <span id="theme-icon">🌙</span> <span id="theme-text">Modo Escuro</span>
</button>

<div class="header">
    <div class="logo-section">
        <svg class="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M 50 10 C 30 10 10 30 10 50 C 10 70 30 90 50 90 C 70 90 90 70 90 50 C 90 30 70 10 50 10 Z M 50 20 C 65 20 80 35 80 50 C 80 65 65 80 50 80 C 35 80 20 65 20 50 C 20 35 35 20 50 20 Z M 50 30 L 50 70 L 60 70 L 60 30 L 50 30 Z M 40 30 L 40 70 L 50 70 L 50 30 L 40 30 Z" fill-rule="evenodd" clip-rule="evenodd"/>
             <path d="M49.9997 19.9999C65.0007 19.9999 79.9997 34.9999 79.9997 49.9999C79.9997 64.9999 65.0007 79.9999 49.9997 79.9999C34.9997 79.9999 19.9997 64.9999 19.9997 49.9999C19.9997 34.9999 34.9997 19.9999 49.9997 19.9999ZM49.9997 30.0001L49.9997 70.0001L59.9997 70.0001L59.9997 30.0001L49.9997 30.0001ZM39.9997 30.0001L39.9997 70.0001L49.9997 70.0001L49.9997 30.0001L39.9997 30.0001Z" />
        </svg>

        <div>
            <h1>OnnoLog <span style="font-weight:300;">Quiz</span></h1>
            <p>Gestão e Reconhecimento de Dados</p>
        </div>
    </div>
    <div class="nav-tabs">
        <button class="nav-btn active" onclick="switchPanel('geral', this)">Painel Geral</button>
        <button class="nav-btn" onclick="switchPanel('perguntas', this)">Gestão de Perguntas</button>
        <button class="nav-btn" onclick="switchPanel('metricas', this)">Ranking</button>
    </div>
</div>

<div class="container">
    <div id="panel-geral" class="panel active">
        <div class="card"><span class="label">Participantes</span><span class="value" id="st-total">0</span></div>
        <div class="card"><span class="label">Média Global</span><span class="value" id="st-avg">0</span></div>
        <div class="card" style="border-bottom: 3px solid var(--success)"><span class="label">Taxa Acerto</span><span class="value" id="st-hit" style="color:var(--success)">0%</span></div>
        <div class="card" style="border-bottom: 3px solid var(--error)"><span class="label">Taxa Erro</span><span class="value" id="st-miss" style="color:var(--error)">0%</span></div>
        <div class="card full">
            <h3 style="margin-top:0; color: var(--text-main);">Relatório de Performance</h3>
            <table id="rank-table-geral">
                <thead><tr><th>Colaborador</th><th>Score</th><th>Precisão</th><th>Data</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div id="panel-perguntas" class="panel">
        <div class="card half">
            <h3 style="margin-top:0; color: var(--text-main);">Nova Pergunta</h3>
            <input type="text" id="new-q" placeholder="Pergunta">
            <input type="text" id="new-o1" placeholder="Resposta Correta" style="border-left: 3px solid var(--success)">
            <input type="text" id="new-o2" placeholder="Opção 2">
            <input type="text" id="new-o3" placeholder="Opção 3">
            <input type="text" id="new-o4" placeholder="Opção 4">
            <button class="btn-main" onclick="addQuestion()">PUBLICAR</button>
        </div>
        <div class="card half">
            <h3 style="margin-top:0; color: var(--text-main);">Banco de Dados</h3>
            <div id="q-list" style="max-height: 400px; overflow-y: auto;">Carregando...</div>
        </div>
    </div>

    <div id="panel-metricas" class="panel">
        <div class="card full" style="text-align: center; background: radial-gradient(circle at bottom, var(--primary) 10%, var(--card-bg) 60%);">
            <span class="label">Elite de Performance</span>
            <div class="podium-container">
                <div class="podium-step second"><div class="avatar">🥈</div><div id="podium-2-name" class="podium-name">---</div><div class="step-block">2</div></div>
                <div class="podium-step first"><div class="avatar">👑</div><div id="podium-1-name" class="podium-name">---</div><div class="step-block">1</div></div>
                <div class="podium-step third"><div class="avatar">🥉</div><div id="podium-3-name" class="podium-name">---</div><div class="step-block">3</div></div>
            </div>
        </div>
        <div class="card full">
            <button class="btn-main" style="background: var(--error); color: #fff;" onclick="clearRanking()">ZERAR TODOS OS RESULTADOS</button>
        </div>
    </div>
</div>

<script>
    const _supabase = supabase.createClient('https://zdthxlhknxpbdfzcozls.supabase.co', 'sb_publishable_6gT5fcstwt1QLjCf5PCAPA_2Ec_6mU4');

    // Lógica de Tema
    function toggleTheme() {
        const body = document.body;
        const icon = document.getElementById('theme-icon');
        const text = document.getElementById('theme-text');
        
        if (body.getAttribute('data-theme') === 'dark') {
            body.setAttribute('data-theme', 'light');
            icon.innerText = '☀️'; text.innerText = 'Modo Claro';
            localStorage.setItem('theme', 'light');
        } else {
            body.setAttribute('data-theme', 'dark');
            icon.innerText = '🌙'; text.innerText = 'Modo Escuro';
            localStorage.setItem('theme', 'dark');
        }
    }

    // Carregar tema salvo
    document.addEventListener('DOMContentLoaded', () => {
        if(localStorage.getItem('theme') === 'light') {
            document.body.setAttribute('data-theme', 'light');
            document.getElementById('theme-icon').innerText = '☀️';
            document.getElementById('theme-text').innerText = 'Modo Claro';
        } else {
            document.body.setAttribute('data-theme', 'dark');
            document.getElementById('theme-icon').innerText = '🌙';
            document.getElementById('theme-text').innerText = 'Modo Escuro';
        }
        load(); // Carrega os dados após definir o tema
    });

    function switchPanel(panelId, btn) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('panel-' + panelId).classList.add('active');
        btn.classList.add('active');
    }

    async function load() {
        const { data: qs } = await _supabase.from('perguntas').select('*');
        const { data: rs } = await _supabase.from('ranking').select('*').order('pontos', { ascending: false });
        if(qs) document.getElementById('q-list').innerHTML = qs.map(q => `<div class="q-item"><span>${q.pergunta}</span><button class="del-q" onclick="deleteQuestion(${q.id})">EXCLUIR</button></div>`).join('');
        if(rs) renderData(rs, qs ? qs.length : 0);
    }

    function renderData(data, totalQ) {
        document.getElementById('st-total').innerText = data.length;
        const avg = data.length > 0 ? Math.round(data.reduce((a, b) => a + b.pontos, 0) / data.length) : 0;
        document.getElementById('st-avg').innerText = avg;
        const hits = data.reduce((a, b) => a + (b.acertos_reais || 0), 0);
        const perc = (data.length * totalQ) > 0 ? Math.round((hits / (data.length * totalQ)) * 100) : 0;
        document.getElementById('st-hit').innerText = perc + "%";
        document.getElementById('st-miss').innerText = (100 - perc) + "%";

        if(data.length >= 1) document.getElementById('podium-1-name').innerText = data[0].nome;
        if(data.length >= 2) document.getElementById('podium-2-name').innerText = data[1].nome;
        if(data.length >= 3) document.getElementById('podium-3-name').innerText = data[2].nome;

        document.querySelector('#rank-table-geral tbody').innerHTML = data.map(s => `<tr><td>${s.nome}</td><td>${s.pontos}</td><td>${s.acertos_reais || 0}/${totalQ}</td><td>${s.criado_em ? new Date(s.criado_em).toLocaleDateString() : '---'}</td></tr>`).join('');
    }

    async function addQuestion() {
        const q = document.getElementById('new-q').value;
        const ops = [document.getElementById('new-o1').value, document.getElementById('new-o2').value, document.getElementById('new-o3').value, document.getElementById('new-o4').value];
        if(!q || ops.includes('')) return alert("Preencha todos os campos!");
        await _supabase.from('perguntas').insert([{ pergunta: q, opcoes: ops, correta: 0 }]);
        location.reload();
    }

    async function deleteQuestion(id) { if(confirm("Excluir?")) { await _supabase.from('perguntas').delete().eq('id', id); load(); } }
    async function clearRanking() { if(confirm("Zerar?")) { await _supabase.from('ranking').delete().neq('id', 0); load(); } }
</script>
</body>
</html>
