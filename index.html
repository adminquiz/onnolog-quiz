<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnnoLog | Dashboard Quiz</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Cores Modo Claro (Baseadas no seu modelo) */
            --bg-body: #f4f7f6;
            --bg-card: #ffffff;
            --text-main: #2C3E50;
            --text-sub: #64748b;
            --primary-grad: linear-gradient(135deg, #43919B 0%, #30AADD 100%);
            --accent-grad: linear-gradient(135deg, #10b981 0%, #34d399 100%);
            --border: #e2e8f0;
            --input-bg: #f8fafc;
        }

        [data-theme="dark"] {
            /* Cores Modo Escuro */
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --border: #334155;
            --input-bg: #0f172a;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: all 0.3s ease;
        }

        /* Toggle Dark Mode */
        .theme-switch {
            position: fixed;
            top: 20px;
            right: 20px;
            cursor: pointer;
            background: var(--bg-card);
            padding: 10px 15px;
            border-radius: 50px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            border: 1px solid var(--border);
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .container {
            background: var(--bg-card);
            width: 90%;
            max-width: 450px;
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            text-align: center;
            border: 1px solid var(--border);
        }

        /* Header & Logo */
        .header { margin-bottom: 30px; }
        .brand {
            font-weight: 800;
            font-size: 28px;
            background: var(--primary-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .tagline {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-sub);
            margin-top: 5px;
        }

        /* Inputs (EDT) */
        .field { text-align: left; margin-bottom: 20px; }
        label { font-size: 11px; font-weight: 700; color: var(--text-sub); margin-left: 5px; }
        input {
            width: 100%;
            padding: 14px;
            margin-top: 6px;
            border-radius: 12px;
            border: 2px solid var(--border);
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #43919B; }

        /* Buttons */
        .btn {
            background: var(--primary-grad);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 14px;
            width: 100%;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn:hover { transform: translateY(-2px); opacity: 0.9; }

        .option-btn {
            background: var(--bg-card);
            color: var(--text-main);
            border: 2px solid var(--border);
            text-align: left;
            margin-bottom: 12px;
            font-weight: 500;
        }
        .option-btn:hover { border-color: #43919B; background: var(--input-bg); }

        /* Quiz Specifics */
        .stats { display: flex; justify-content: space-between; font-weight: 700; font-size: 14px; margin-bottom: 10px; color: #43919B; }
        #timer-bar { width: 100%; height: 6px; background: var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 25px; }
        #timer-fill { height: 100%; background: var(--accent-grad); width: 100%; transition: width 1s linear; }

        /* Ranking Table */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { font-size: 10px; color: var(--text-sub); text-transform: uppercase; padding: 10px; text-align: left; }
        td { padding: 12px 10px; border-bottom: 1px solid var(--border); font-size: 14px; text-align: left; }
        .pos { font-weight: 800; color: #43919B; }
        .score-val { font-weight: 700; text-align: right; }

        .hidden { display: none; }
    </style>
</head>
<body data-theme="light">

    <div class="theme-switch" onclick="toggleTheme()">
        <span id="theme-icon">🌙</span> <span id="theme-text">Modo Escuro</span>
    </div>

    <div class="container" id="screen-home">
        <div class="header">
            <span class="brand">OnnoLog Quiz</span>
            <div class="tagline">Data Management & Recognition</div>
        </div>
        <div class="field">
            <label>IDENTIFICAÇÃO DO COLABORADOR</label>
            <input type="text" id="username" placeholder="Digite seu nome...">
        </div>
        <button class="btn" onclick="startQuiz()">ACESSAR PAINEL</button>
    </div>

    <div class="container hidden" id="screen-quiz">
        <div class="stats">
            <span id="score-txt">SCORE: 0000</span>
            <span id="timer-txt">30s</span>
        </div>
        <div id="timer-bar"><div id="timer-fill"></div></div>
        <h3 id="q-text" style="margin-bottom: 25px; line-height: 1.4;">Carregando dados...</h3>
        <div id="options-box"></div>
    </div>

    <div class="container hidden" id="screen-ranking">
        <div class="header" style="margin-bottom: 15px;">
            <span class="brand" style="font-size: 20px;">Relatório de Performance</span>
        </div>
        <div id="loading-ranking" style="font-size: 12px; color: var(--text-sub);">Sincronizando logs...</div>
        <table id="ranking-table" class="hidden">
            <thead>
                <tr>
                    <th>POS</th>
                    <th>COLABORADOR</th>
                    <th style="text-align:right">SCORE</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <button class="btn" onclick="location.reload()" style="margin-top:25px;">NOVO TESTE</button>
    </div>

    <script>
        const _supabase = supabase.createClient('https://zdthxlhknxpbdfzcozls.supabase.co', 'sb_publishable_6gT5fcstwt1QLjCf5PCAPA_2Ec_6mU4');
        let questions = [], currentQ = 0, score = 0, acertosReais = 0, timeLeft = 30, timerInterval, user = "";

        // Lógica de Tema
        function toggleTheme() {
            const body = document.body;
            const isDark = body.getAttribute('data-theme') === 'dark';
            body.setAttribute('data-theme', isDark ? 'light' : 'dark');
            document.getElementById('theme-icon').innerText = isDark ? '🌙' : '☀️';
            document.getElementById('theme-text').innerText = isDark ? 'Modo Escuro' : 'Modo Claro';
        }

        // Lógica do Quiz (Mantida conforme sua necessidade)
        async function startQuiz() {
            user = document.getElementById('username').value.trim();
            if(!user) return alert("Por favor, insira sua identificação.");
            const { data, error } = await _supabase.from('perguntas').select('*');
            if(error || !data.length) return alert("Erro ao conectar com a base de dados.");
            questions = data;
            document.getElementById('screen-home').classList.add('hidden');
            document.getElementById('screen-quiz').classList.remove('hidden');
            showQuestion();
        }

        function showQuestion() {
            if(currentQ >= questions.length) return endQuiz();
            timeLeft = 30; updateTimer();
            const data = questions[currentQ];
            document.getElementById('q-text').innerText = data.pergunta;
            const box = document.getElementById('options-box'); box.innerHTML = "";
            let opts = data.opcoes.map((o, i) => ({o, i})).sort(() => Math.random() - 0.5);
            opts.forEach(item => {
                const b = document.createElement('button');
                b.className = "btn option-btn"; b.innerText = item.o;
                b.onclick = () => handleAnswer(item.i === data.correta);
                box.appendChild(b);
            });
            clearInterval(timerInterval);
            timerInterval = setInterval(() => { timeLeft--; updateTimer(); if(timeLeft <= 0) handleAnswer(false); }, 1000);
        }

        function updateTimer() {
            document.getElementById('timer-txt').innerText = timeLeft + "s";
            document.getElementById('timer-fill').style.width = (timeLeft/30*100) + "%";
        }

        function handleAnswer(isCorrect) {
            clearInterval(timerInterval);
            if(isCorrect) { score += 500 + (timeLeft * 20); acertosReais++; }
            document.getElementById('score-txt').innerText = "SCORE: " + String(score).padStart(4, '0');
            currentQ++;
            setTimeout(showQuestion, 300);
        }

        async function endQuiz() {
            document.getElementById('screen-quiz').classList.add('hidden');
            document.getElementById('screen-ranking').classList.remove('hidden');
            await _supabase.from('ranking').insert([{ nome: user, pontos: score, acertos_reais: acertosReais }]);
            showRanking();
        }

        async function showRanking() {
            const { data } = await _supabase.from('ranking').select('*').order('pontos', { ascending: false }).limit(6);
            document.getElementById('loading-ranking').classList.add('hidden');
            const table = document.getElementById('ranking-table');
            table.classList.remove('hidden');
            const tbody = table.querySelector('tbody');
            tbody.innerHTML = data.map((s, i) => `
                <tr>
                    <td class="pos">#${i+1}</td>
                    <td>${s.nome}</td>
                    <td class="score-val">${s.pontos}</td>
                </tr>`).join('');
        }
    </script>
</body>
</html>
