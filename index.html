<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data & Recognition Quiz</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Mantendo seu padrão de cores e gradiente */
        :root { 
            --p: #4A90E2; 
            --s: #2ECC71; 
            --dark: #2C3E50; 
            --light: #F4F7F6; 
            --accent: #6366f1;
        }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: radial-gradient(circle at top right, #e2e8f0, var(--light)); 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }

        .container { 
            background: white; 
            width: 92%; 
            max-width: 450px; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            text-align: center; 
            position: relative;
            overflow: hidden;
        }

        /* Efeito de Scan (Recognition) */
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--p);
            box-shadow: 0 0 15px var(--p);
            opacity: 0;
            z-index: 10;
        }

        .scanning .scan-line {
            animation: scanMove 1.5s infinite linear;
            opacity: 0.5;
        }

        @keyframes scanMove {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .hidden { display: none; }

        /* Botões com o gradiente solicitado */
        .btn { 
            background: linear-gradient(135deg, var(--p), var(--accent)); 
            color: white; 
            border: none; 
            padding: 16px; 
            border-radius: 12px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: bold; 
            font-size: 18px; 
            margin: 10px 0; 
            transition: all 0.3s ease;
        }

        .btn:hover { opacity: 0.9; transform: scale(1.01); }

        .option-btn { 
            background: white; 
            color: var(--dark); 
            border: 2px solid #eee; 
            text-align: left; 
            font-size: 16px; 
        }

        .option-btn:hover { border-color: var(--p); background: #f0f7ff; }

        #timer-bar { width: 100%; height: 8px; background: #eee; border-radius: 4px; margin: 15px 0; overflow: hidden; }
        #timer-fill { width: 100%; height: 100%; background: var(--s); transition: width 1s linear; }

        input { 
            width: 100%; 
            padding: 15px; 
            border-radius: 10px; 
            border: 2px solid #ddd; 
            box-sizing: border-box; 
            font-size: 16px; 
            margin-bottom: 10px; 
            outline-color: var(--p);
        }
    </style>
</head>
<body>

<div class="container" id="screen-home">
    <div class="scan-line"></div>
    <h1 style="color: var(--dark)">📊 <span style="color: var(--p)">OnnoLog</span> Insight</h1>
    <p style="color: #7f8c8d; font-size: 14px; margin-top: -10px;">Data Management & Recognition</p>
    <input type="text" id="username" placeholder="ID do Operador">
    <button class="btn" onclick="startQuiz()">AUTENTICAR E INICIAR</button>
</div>

<div class="container hidden" id="screen-quiz">
    <div class="scan-line"></div>
    <div style="display:flex; justify-content:space-between; font-weight:bold; font-family: monospace;">
        <span id="score-txt" style="color: var(--p)">0 pts</span>
        <span id="timer-txt">30s</span>
    </div>
    <div id="timer-bar"><div id="timer-fill"></div></div>
    
    <div style="text-align: left; font-size: 10px; color: var(--p); letter-spacing: 1px; font-weight: bold;">ANALYZING DATA...</div>
    <h3 id="q-text" style="min-height: 50px; margin-top: 5px;">Carregando bases...</h3>
    
    <div id="options-box"></div>
</div>

<div class="container hidden" id="screen-ranking">
    <h2 style="color: var(--dark)">🏆 Ranking de Processamento</h2>
    <div id="loading-ranking">Sincronizando logs...</div>
    <table id="ranking-table" class="hidden" style="width:100%; border-collapse: collapse;">
        <thead>
            <tr style="color: #7f8c8d; font-size: 12px; border-bottom: 2px solid #eee;">
                <th style="padding: 10px; text-align: left;">POS</th>
                <th style="text-align: left;">NOME</th>
                <th style="text-align: right;">PONTOS</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <button class="btn" onclick="location.reload()" style="margin-top:20px; background: var(--dark);">REINICIAR SISTEMA</button>
</div>

<script>
    const _supabase = supabase.createClient('https://zdthxlhknxpbdfzcozls.supabase.co', 'sb_publishable_6gT5fcstwt1QLjCf5PCAPA_2Ec_6mU4');
    let questions = [], currentQ = 0, score = 0, acertosReais = 0, timeLeft = 30, timerInterval, user = "";

    async function startQuiz() {
        user = document.getElementById('username').value.trim();
        if(!user) return alert("Por favor, identifique o operador!");
        
        // Ativa animação de scan na home antes de entrar
        document.getElementById('screen-home').classList.add('scanning');
        
        const { data, error } = await _supabase.from('perguntas').select('*');
        if(error || !data || data.length === 0) return alert("Erro na extração de dados.");
        
        questions = data;
        setTimeout(() => {
            document.getElementById('screen-home').classList.add('hidden');
            document.getElementById('screen-quiz').classList.remove('hidden');
            showQuestion();
        }, 800);
    }

    function showQuestion() {
        if(currentQ >= questions.length) return endQuiz();
        
        const quizContainer = document.getElementById('screen-quiz');
        quizContainer.classList.add('scanning'); // Ativa scan na nova pergunta
        
        timeLeft = 30; updateTimer();
        const data = questions[currentQ];
        document.getElementById('q-text').innerText = data.pergunta;
        
        const box = document.getElementById('options-box'); 
        box.innerHTML = "";
        
        let opts = data.opcoes.map((o, i) => ({o, i})).sort(() => Math.random() - 0.5);
        opts.forEach(item => {
            const b = document.createElement('button');
            b.className = "btn option-btn"; b.innerText = item.o;
            b.onclick = () => {
                quizContainer.classList.remove('scanning'); // Remove scan ao responder
                handleAnswer(item.i === data.correta);
            };
            box.appendChild(b);
        });
        
        clearInterval(timerInterval);
        timerInterval = setInterval(() => { 
            timeLeft--; 
            updateTimer(); 
            if(timeLeft <= 0) handleAnswer(false); 
        }, 1000);
    }

    function updateTimer() {
        document.getElementById('timer-txt').innerText = timeLeft + "s";
        document.getElementById('timer-fill').style.width = (timeLeft/30*100) + "%";
        document.getElementById('timer-fill').style.background = timeLeft < 10 ? "#e74c3c" : var(--s);
    }

    function handleAnswer(isCorrect) {
        clearInterval(timerInterval);
        if(isCorrect) {
            score += 500 + (timeLeft * 20);
            acertosReais++;
        }
        document.getElementById('score-txt').innerText = score + " pts";
        currentQ++;
        setTimeout(showQuestion, 400);
    }

    async function endQuiz() {
        document.getElementById('screen-quiz').classList.add('hidden');
        document.getElementById('screen-ranking').classList.remove('hidden');
        
        const { error } = await _supabase.from('ranking').insert([{ 
            nome: user, 
            pontos: score, 
            acertos_reais: acertosReais 
        }]);

        if(error) console.error("Erro no log de dados:", error);
        showRanking();
    }

    async function showRanking() {
        const { data } = await _supabase.from('ranking').select('*').order('pontos', { ascending: false }).limit(10);
        document.getElementById('loading-ranking').classList.add('hidden');
        const table = document.getElementById('ranking-table');
        table.classList.remove('hidden');
        const tbody = table.querySelector('tbody');
        tbody.innerHTML = data.map((s, i) => `
            <tr style="border-bottom: 1px solid #eee;">
                <td style="padding:12px;"><b>${i+1}º</b></td>
                <td>${s.nome}</td>
                <td style="text-align:right; font-weight:bold; color:var(--p);">${s.pontos}</td>
            </tr>`).join('');
    }
</script>
</body>
</html>
