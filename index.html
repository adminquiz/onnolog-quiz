<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data & Recognition Quiz</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --p: #2563eb; /* Azul Tech */
            --s: #10b981; /* Verde Success */
            --dark: #0f172a; /* Slate Dark */
            --light: #f8fafc; 
            --accent: #6366f1; /* Violeta de IA */
        }
        
        body { 
            font-family: 'Inter', 'Segoe UI', sans-serif; 
            background: radial-gradient(circle at top right, #e2e8f0, var(--light)); 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }

        .container { 
            background: white; 
            width: 92%; 
            max-width: 450px; 
            padding: 30px; 
            border-radius: 24px; 
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04); 
            text-align: center; 
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .hidden { display: none; }

        .btn { 
            background: linear-gradient(135deg, var(--p), var(--accent)); 
            color: white; 
            border: none; 
            padding: 16px; 
            border-radius: 14px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: 600; 
            font-size: 16px; 
            margin: 12px 0; 
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }

        .option-btn { 
            background: #ffffff; 
            color: var(--dark); 
            border: 2px solid #f1f5f9; 
            text-align: left; 
            font-size: 15px; 
            text-transform: none;
            letter-spacing: normal;
        }

        .option-btn:hover { background: #f8fafc; border-color: var(--p); color: var(--p); }

        #timer-bar { width: 100%; height: 6px; background: #f1f5f9; border-radius: 10px; margin: 20px 0; overflow: hidden; }
        #timer-fill { width: 100%; height: 100%; background: var(--s); transition: width 1s linear; }

        input { 
            width: 100%; 
            padding: 15px; 
            border-radius: 12px; 
            border: 2px solid #e2e8f0; 
            box-sizing: border-box; 
            font-size: 16px; 
            margin-bottom: 15px; 
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus { border-color: var(--p); }

        .status-badge {
            font-size: 12px;
            background: #f1f5f9;
            padding: 4px 12px;
            border-radius: 20px;
            color: #64748b;
            margin-bottom: 10px;
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="container" id="screen-home">
    <div class="status-badge">DATA RECOGNITION SYSTEM V2.0</div>
    <h1 style="color: var(--dark); margin-top: 10px;">🔍 <span style="color: var(--p)">OnnoLog</span> Insight</h1>
    <p style="color: #64748b; font-size: 14px; margin-bottom: 25px;">Teste suas habilidades em Captura e Gestão de Dados.</p>
    
    <input type="text" id="username" placeholder="Identificação do Operador">
    <button class="btn" onclick="startQuiz()">INICIAR PROCESSAMENTO</button>
</div>

<div class="container hidden" id="screen-quiz">
    <div style="display:flex; justify-content:space-between; align-items: center; font-family: monospace;">
        <span id="score-txt" style="color: var(--p); font-size: 18px;">SCORE: 0000</span>
        <span id="timer-txt" style="color: #64748b;">30s</span>
    </div>
    <div id="timer-bar"><div id="timer-fill"></div></div>
    
    <div style="text-align: left; margin-bottom: 10px; color: #94a3b8; font-size: 12px; font-weight: bold;">INPUT DATA:</div>
    <h3 id="q-text" style="min-height: 60px; margin-top: 0; color: var(--dark); line-height: 1.4;">Carregando bases...</h3>
    
    <div id="options-box"></div>
</div>

<div class="container hidden" id="screen-ranking">
    <h2 style="color: var(--dark)">🏆 Ranking de Performance</h2>
    <div id="loading-ranking" style="color: #64748b; padding: 20px;">Sincronizando banco de dados...</div>
    
    <table id="ranking-table" class="hidden" style="width:100%; border-collapse: collapse; margin-top: 10px;">
        <thead style="border-bottom: 2px solid #f1f5f9; color: #64748b; font-size: 13px;">
            <tr>
                <th style="padding: 10px; text-align: left;">POS</th>
                <th style="text-align: left;">OPERADOR</th>
                <th style="text-align: right;">SCORE</th>
            </tr>
        </thead>
        <tbody style="color: var(--dark); font-size: 15px;"></tbody>
    </table>
    
    <button class="btn" onclick="location.reload()" style="margin-top:25px; background: var(--dark);">REINICIAR SISTEMA</button>
</div>

<script>
    // Mantendo sua lógica original do Supabase e Quiz
    const _supabase = supabase.createClient('https://zdthxlhknxpbdfzcozls.supabase.co', 'sb_publishable_6gT5fcstwt1QLjCf5PCAPA_2Ec_6mU4');
    let questions = [], currentQ = 0, score = 0, acertosReais = 0, timeLeft = 30, timerInterval, user = "";

    async function startQuiz() {
        user = document.getElementById('username').value.trim();
        if(!user) return alert("Identificação necessária!");
        const { data, error } = await _supabase.from('perguntas').select('*');
        if(error || !data || data.length === 0) return alert("Falha na conexão com o servidor de dados.");
        questions = data;
        document.getElementById('screen-home').classList.add('hidden');
        document.getElementById('screen-quiz').classList.remove('hidden');
        showQuestion();
    }

    function showQuestion() {
        if(currentQ >= questions.length) return endQuiz();
        timeLeft = 30; updateTimer();
        const data = questions[currentQ];
        document.getElementById('q-text').innerText = data.pergunta;
        const box = document.getElementById('options-box'); box.innerHTML = "";
        let opts = data.opcoes.map((o, i) => ({o, i})).sort(() => Math.random() - 0.5);
        opts.forEach(item => {
            const b = document.createElement('button');
            b.className = "btn option-btn"; b.innerText = item.o;
            b.onclick = () => handleAnswer(item.i === data.correta);
            box.appendChild(b);
        });
        clearInterval(timerInterval);
        timerInterval = setInterval(() => { timeLeft--; updateTimer(); if(timeLeft <= 0) handleAnswer(false); }, 1000);
    }

    function updateTimer() {
        document.getElementById('timer-txt').innerText = timeLeft + "s";
        document.getElementById('timer-fill').style.width = (timeLeft/30*100) + "%";
        document.getElementById('timer-fill').style.background = timeLeft < 10 ? "#ef4444" : "#10b981";
    }

    function handleAnswer(isCorrect) {
        clearInterval(timerInterval);
        if(isCorrect) {
            score += 500 + (timeLeft * 20);
            acertosReais++;
        }
        document.getElementById('score-txt').innerText = "SCORE: " + String(score).padStart(4, '0');
        currentQ++;
        setTimeout(showQuestion, 400);
    }

    async function endQuiz() {
        document.getElementById('screen-quiz').classList.add('hidden');
        document.getElementById('screen-ranking').classList.remove('hidden');
        
        const { error } = await _supabase.from('ranking').insert([{ 
            nome: user, 
            pontos: score, 
            acertos_reais: acertosReais 
        }]);

        if(error) console.error("Erro ao sincronizar dados:", error);
        showRanking();
    }

    async function showRanking() {
        const { data } = await _supabase.from('ranking').select('*').order('pontos', { ascending: false }).limit(10);
        document.getElementById('loading-ranking').classList.add('hidden');
        const table = document.getElementById('ranking-table');
        table.classList.remove('hidden');
        const tbody = table.querySelector('tbody');
        tbody.innerHTML = data.map((s, i) => `
            <tr style="border-bottom: 1px solid #f1f5f9;">
                <td style="padding:12px; font-weight:bold;">#${i+1}</td>
                <td>${s.nome}</td>
                <td style="text-align:right; font-weight:bold; color:var(--p);">${s.pontos}</td>
            </tr>`).join('');
    }
</script>
</body>
</html>
