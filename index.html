<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnnoLog Data Quiz</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            /* Cores extraídas do padrão OnnoLog */
            --p: #4A90E2; 
            --s: #2ECC71; 
            --dark: #2C3E50; 
            --light: #F4F7F6;
            /* O Gradiente Assinatura */
            --grad: linear-gradient(135deg, #4A90E2 0%, #2ECC71 100%);
        }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--light); 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }

        .container { 
            background: white; 
            width: 92%; 
            max-width: 450px; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
            text-align: center; 
            position: relative;
            border-top: 5px solid #4A90E2; /* Detalhe da cor principal */
        }

        /* Título com Gradiente OnnoLog */
        .brand-text {
            background: var(--grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            font-size: 28px;
        }

        /* Botão com o Gradiente da Logo */
        .btn { 
            background: var(--grad); 
            color: white; 
            border: none; 
            padding: 16px; 
            border-radius: 12px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: bold; 
            font-size: 18px; 
            margin: 10px 0; 
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(46, 204, 113, 0.4);
        }

        /* Estilo do Input (EDT) */
        input { 
            width: 100%; 
            padding: 15px; 
            border-radius: 10px; 
            border: 2px solid #eee; 
            box-sizing: border-box; 
            font-size: 16px; 
            margin-bottom: 15px; 
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: var(--p);
            background: #fdfdfd;
        }

        .option-btn { 
            background: white; 
            color: var(--dark); 
            border: 2px solid #f0f0f0; 
            text-align: left; 
            font-size: 16px;
            transition: all 0.2s;
        }

        .option-btn:hover {
            border-color: var(--s);
            color: var(--p);
            background: #fafffd;
        }

        /* Barra de Timer com Gradiente */
        #timer-bar { width: 100%; height: 10px; background: #eee; border-radius: 5px; margin: 15px 0; overflow: hidden; }
        #timer-fill { 
            width: 100%; 
            height: 100%; 
            background: var(--grad); 
            transition: width 1s linear; 
        }

        #score-txt { color: var(--p); font-weight: bold; }
    </style>
</head>
<body>

<div class="container" id="screen-home">
    <div style="margin-bottom: 20px;">
        <span class="brand-text">OnnoLog</span>
        <div style="font-size: 12px; color: var(--dark); letter-spacing: 2px; font-weight: bold; margin-top: -5px;">DATA MANAGEMENT</div>
    </div>
    
    <input type="text" id="username" placeholder="Nome do Operador">
    <button class="btn" onclick="startQuiz()">INICIAR RECOGNITION</button>
</div>

<div class="container hidden" id="screen-quiz">
    <div style="display:flex; justify-content:space-between; align-items: center;">
        <span id="score-txt">0 PTS</span>
        <span id="timer-txt" style="font-family: monospace; font-weight: bold;">30s</span>
    </div>
    <div id="timer-bar"><div id="timer-fill"></div></div>
    
    <h3 id="q-text" style="color: var(--dark); min-height: 50px;">Processando dados...</h3>
    <div id="options-box"></div>
</div>

<div class="container hidden" id="screen-ranking">
    <h2 class="brand-text" style="font-size: 22px;">Performance de Captura</h2>
    <div id="loading-ranking">Sincronizando logs...</div>
    <table id="ranking-table" class="hidden" style="width:100%; border-collapse: collapse; margin-top: 15px;">
        <thead>
            <tr style="border-bottom: 2px solid #eee; color: #999; font-size: 12px;">
                <th style="padding: 10px; text-align: left;">RANK</th>
                <th style="text-align: left;">USER</th>
                <th style="text-align: right;">PTS</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <button class="btn" onclick="location.reload()" style="margin-top:20px;">REPROCESSAR</button>
</div>

<script>
    // Lógica permanece idêntica à funcional que você enviou
    const _supabase = supabase.createClient('https://zdthxlhknxpbdfzcozls.supabase.co', 'sb_publishable_6gT5fcstwt1QLjCf5PCAPA_2Ec_6mU4');
    let questions = [], currentQ = 0, score = 0, acertosReais = 0, timeLeft = 30, timerInterval, user = "";

    async function startQuiz() {
        user = document.getElementById('username').value.trim();
        if(!user) return alert("Identifique-se para acessar o banco.");
        const { data, error } = await _supabase.from('perguntas').select('*');
        if(error || !data || data.length === 0) return alert("Erro de conexão.");
        questions = data;
        document.getElementById('screen-home').classList.add('hidden');
        document.getElementById('screen-quiz').classList.remove('hidden');
        showQuestion();
    }

    function showQuestion() {
        if(currentQ >= questions.length) return endQuiz();
        timeLeft = 30; updateTimer();
        const data = questions[currentQ];
        document.getElementById('q-text').innerText = data.pergunta;
        const box = document.getElementById('options-box'); box.innerHTML = "";
        let opts = data.opcoes.map((o, i) => ({o, i})).sort(() => Math.random() - 0.5);
        opts.forEach(item => {
            const b = document.createElement('button');
            b.className = "btn option-btn"; b.innerText = item.o;
            b.onclick = () => handleAnswer(item.i === data.correta);
            box.appendChild(b);
        });
        clearInterval(timerInterval);
        timerInterval = setInterval(() => { timeLeft--; updateTimer(); if(timeLeft <= 0) handleAnswer(false); }, 1000);
    }

    function updateTimer() {
        document.getElementById('timer-txt').innerText = timeLeft + "s";
        document.getElementById('timer-fill').style.width = (timeLeft/30*100) + "%";
    }

    function handleAnswer(isCorrect) {
        clearInterval(timerInterval);
        if(isCorrect) {
            score += 500 + (timeLeft * 20);
            acertosReais++;
        }
        document.getElementById('score-txt').innerText = score + " PTS";
        currentQ++;
        setTimeout(showQuestion, 400);
    }

    async function endQuiz() {
        document.getElementById('screen-quiz').classList.add('hidden');
        document.getElementById('screen-ranking').classList.remove('hidden');
        await _supabase.from('ranking').insert([{ nome: user, pontos: score, acertos_reais: acertosReais }]);
        showRanking();
    }

    async function showRanking() {
        const { data } = await _supabase.from('ranking').select('*').order('pontos', { ascending: false }).limit(10);
        document.getElementById('loading-ranking').classList.add('hidden');
        const table = document.getElementById('ranking-table');
        table.classList.remove('hidden');
        const tbody = table.querySelector('tbody');
        tbody.innerHTML = data.map((s, i) => `<tr style="border-bottom: 1px solid #eee;"><td style="padding:12px;"><b>#${i+1}</b></td><td>${s.nome}</td><td style="text-align:right; font-weight:bold; color:var(--p);">${s.pontos}</td></tr>`).join('');
    }
</script>
</body>
</html>
