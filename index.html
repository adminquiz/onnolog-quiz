<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnnoLog Insight | Data Management</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* PADRÃO DE CORES ONNOLOG */
        :root { 
            --p: #43919B; /* Verde Água Principal */
            --s: #30AADD; /* Azul Secundário */
            --success: #2ECC71; 
            --dark: #1E293B; 
            --light: #F8FAFC;
            /* Gradiente Assinatura */
            --grad: linear-gradient(90deg, #43919B 0%, #30AADD 100%);
        }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--light);
            background-image: radial-gradient(circle at top right, rgba(67, 145, 155, 0.1), transparent);
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }

        .container { 
            background: white; 
            width: 92%; 
            max-width: 450px; 
            padding: 30px; 
            border-radius: 24px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.08); 
            text-align: center; 
            position: relative;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        /* Efeito de Scan (Recognition) nas cores da marca */
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--grad);
            box-shadow: 0 0 15px var(--p);
            opacity: 0;
            z-index: 10;
        }

        .scanning .scan-line {
            animation: scanMove 2s infinite linear;
            opacity: 0.7;
        }

        @keyframes scanMove {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .hidden { display: none; }

        /* Botões com o Gradiente OnnoLog */
        .btn { 
            background: var(--grad); 
            color: white; 
            border: none; 
            padding: 16px; 
            border-radius: 14px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: 700; 
            font-size: 16px; 
            margin: 10px 0; 
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 5px 15px rgba(67, 145, 155, 0.3); }

        .option-btn { 
            background: white; 
            color: var(--dark); 
            border: 2px solid #F1F5F9; 
            text-align: left; 
            font-size: 15px; 
            text-transform: none;
            letter-spacing: 0;
        }

        .option-btn:hover { border-color: var(--p); background: #F0F9FA; color: var(--p); }

        /* Timer nas cores da marca */
        #timer-bar { width: 100%; height: 6px; background: #F1F5F9; border-radius: 10px; margin: 15px 0; overflow: hidden; }
        #timer-fill { width: 100%; height: 100%; background: var(--grad); transition: width 1s linear; }

        input { 
            width: 100%; 
            padding: 15px; 
            border-radius: 12px; 
            border: 2px solid #E2E8F0; 
            box-sizing: border-box; 
            font-size: 16px; 
            margin-bottom: 15px; 
            outline: none;
            transition: border-color 0.3s;
        }
        
        input:focus { border-color: var(--p); background: #fdfdfd; }

        .brand-accent {
            background: var(--grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
    </style>
</head>
<body>

<div class="container" id="screen-home">
    <div class="scan-line"></div>
    <h1 style="color: var(--dark); margin-bottom: 5px;">📊 <span class="brand-accent">OnnoLog</span> Insight</h1>
    <p style="color: #94A3B8; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 25px;">Data Management & Recognition</p>
    
    <input type="text" id="username" placeholder="ID do Operador">
    <button class="btn" onclick="startQuiz()">AUTENTICAR E INICIAR</button>
</div>

<div class="container hidden" id="screen-quiz">
    <div class="scan-line"></div>
    <div style="display:flex; justify-content:space-between; font-weight:bold; font-family: monospace; font-size: 14px;">
        <span id="score-txt" style="color: var(--p)">SCORE: 0000</span>
        <span id="timer-txt" style="color: #94A3B8;">30s</span>
    </div>
    <div id="timer-bar"><div id="timer-fill"></div></div>
    
    <div style="text-align: left; font-size: 10px; color: var(--p); letter-spacing: 1.5px; font-weight: 800; margin-bottom: 5px;">ANALYZING DATA...</div>
    <h3 id="q-text" style="min-height: 60px; margin-top: 0; color: var(--dark); line-height: 1.4;">Carregando bases...</h3>
    
    <div id="options-box"></div>
</div>

<div class="container hidden" id="screen-ranking">
    <h2 style="color: var(--dark); font-weight: 800;">🏆 Ranking de Performance</h2>
    <div id="loading-ranking" style="color: #94A3B8; font-size: 14px; padding: 20px;">Sincronizando logs...</div>
    <table id="ranking-table" class="hidden" style="width:100%; border-collapse: collapse;">
        <thead>
            <tr style="color: #94A3B8; font-size: 11px; border-bottom: 2px solid #F1F5F9; text-transform: uppercase;">
                <th style="padding: 12px 10px; text-align: left;">POS</th>
                <th style="text-align: left;">NOME</th>
                <th style="text-align: right;">PONTOS</th>
            </tr>
        </thead>
        <tbody style="font-size: 14px; color: var(--dark);"></tbody>
    </table>
    <button class="btn" onclick="location.reload()" style="margin-top:25px; background: var(--dark);">REINICIAR SISTEMA</button>
</div>

<script>
    const _supabase = supabase.createClient('https://zdthxlhknxpbdfzcozls.supabase.co', 'sb_publishable_6gT5fcstwt1QLjCf5PCAPA_2Ec_6mU4');
    let questions = [], currentQ = 0, score = 0, acertosReais = 0, timeLeft = 30, timerInterval, user = "";

    async function startQuiz() {
        user = document.getElementById('username').value.trim();
        if(!user) return alert("Por favor, identifique o operador!");
        
        document.getElementById('screen-home').classList.add('scanning');
        
        const { data, error } = await _supabase.from('perguntas').select('*');
        if(error || !data || data.length === 0) return alert("Erro na extração de dados.");
        
        questions = data;
        setTimeout(() => {
            document.getElementById('screen-home').classList.add('hidden');
            document.getElementById('screen-quiz').classList.remove('hidden');
            showQuestion();
        }, 800);
    }

    function showQuestion() {
        if(currentQ >= questions.length) return endQuiz();
        
        const quizContainer = document.getElementById('screen-quiz');
        quizContainer.classList.add('scanning');
        
        timeLeft = 30; updateTimer();
        const data = questions[currentQ];
        document.getElementById('q-text').innerText = data.pergunta;
        
        const box = document.getElementById('options-box'); 
        box.innerHTML = "";
        
        let opts = data.opcoes.map((o, i) => ({o, i})).sort(() => Math.random() - 0.5);
        opts.forEach(item => {
            const b = document.createElement('button');
            b.className = "btn option-btn"; b.innerText = item.o;
            b.onclick = () => {
                quizContainer.classList.remove('scanning');
                handleAnswer(item.i === data.correta);
            };
            box.appendChild(b);
        });
        
        clearInterval(timerInterval);
        timerInterval = setInterval(() => { 
            timeLeft--; 
            updateTimer(); 
            if(timeLeft <= 0) handleAnswer(false); 
        }, 1000);
    }

    function updateTimer() {
        document.getElementById('timer-txt').innerText = timeLeft + "s";
        document.getElementById('timer-fill').style.width = (timeLeft/30*100) + "%";
        // Mantém o timer sempre no gradiente da marca ou muda para vermelho no final
        if (timeLeft < 10) {
            document.getElementById('timer-fill').style.background = "#e74c3c";
        } else {
            document.getElementById('timer-fill').style.background = "var(--grad)";
        }
    }

    function handleAnswer(isCorrect) {
        clearInterval(timerInterval);
        if(isCorrect) {
            score += 500 + (timeLeft * 20);
            acertosReais++;
        }
        document.getElementById('score-txt').innerText = "SCORE: " + String(score).padStart(4, '0');
        currentQ++;
        setTimeout(showQuestion, 400);
    }

    async function endQuiz() {
        document.getElementById('screen-quiz').classList.add('hidden');
        document.getElementById('screen-ranking').classList.remove('hidden');
        
        const { error } = await _supabase.from('ranking').insert([{ 
            nome: user, 
            pontos: score, 
            acertos_reais: acertosReais 
        }]);

        if(error) console.error("Erro no log de dados:", error);
        showRanking();
    }

    async function showRanking() {
        const { data } = await _supabase.from('ranking').select('*').order('pontos', { ascending: false }).limit(10);
        document.getElementById('loading-ranking').classList.add('hidden');
        const table = document.getElementById('ranking-table');
        table.classList.remove('hidden');
        const tbody = table.querySelector('tbody');
        tbody.innerHTML = data.map((s, i) => `
            <tr style="border-bottom: 1px solid #F1F5F9;">
                <td style="padding:15px 10px;"><b>#${i+1}</b></td>
                <td>${s.nome}</td>
                <td style="text-align:right; font-weight:800; color:var(--p);">${s.pontos}</td>
            </tr>`).join('');
    }
</script>
</body>
</html>
